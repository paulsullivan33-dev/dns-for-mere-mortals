# dnsmasq-lab.conf — the guide's lab configuration.
# Run it with: dnsmasq --conf-file=dnsmasq-lab.conf --no-daemon
# Serves the made-up example.test zone on loopback only, high port,
# no upstream forwarding. Verified with dnsmasq 2.91 + dig 9.18.
port=15353
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts
no-poll
local-ttl=300
addn-hosts=lab-hosts.txt
cname=blog.example.test,www.example.test
mx-host=example.test,mail.example.test,10
txt-record=example.test,"v=spf1 mx -all"
ptr-record=25.2.0.192.in-addr.arpa,mail.example.test
auth-server=ns.example.test
auth-zone=example.test
auth-ttl=300
